<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E"/>
<title>Scopely Dashboard</title>
<style>
:root{
  --ground:#eef1f3; --surface:#fff; --ink:#2c3036; --muted:#79818a; --faint:#a7aeb5;
  --hair:#e5e8eb; --hair2:#f2f4f6; --accent:#cf4b3b; --accent-ink:#fff; --header:#2b313a;
  --header-ink:#fff; --link:#3e6fb0; --charcoal:#3a4046;
  --ok:#33a15c; --ok-bg:#e7f4ec; --warn:#c77a16; --warn-bg:#faefdd; --crit:#d64b3f; --crit-bg:#fbe7e5;
  --brief:#3e6fb0; --brief-bg:#e9f0fa;
  --lqa:#e5942f; --lqa-bg:#fbeeda;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --sans:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
.topbar{background:var(--header);color:var(--header-ink);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 2px 8px rgba(40,44,50,.18);position:relative;z-index:2;}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:.11em;}
.topbar .brand small{font-weight:500;opacity:.75;margin-left:8px;font-size:12px;letter-spacing:0;}
.topbar .meta{font-size:12px;color:rgba(255,255,255,.72);display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums;}
.refresh-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.12s;}
.refresh-btn:hover{background:rgba(255,255,255,.24);}
.refresh-btn:disabled{opacity:.6;cursor:progress;}
.refresh-btn.spin{animation:none;}
.refresh-btn .ico{display:inline-block;}
.refresh-btn.busy .ico{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.topsticky{position:sticky;top:0;z-index:10;background:var(--ground);}
.topfixed{background:var(--ground);}
.wrap{max-width:1760px;margin:0 auto;padding:0 28px 60px;}
.wrap--head{padding:0 28px;}
.tabs{display:flex;gap:4px;padding:14px 0 0;flex-wrap:wrap;}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.headrow-btns{display:flex;gap:8px;align-items:center;}
.mini-link{background:var(--surface);border:1.5px solid var(--faint);color:var(--muted);font-size:11px;line-height:1;
  padding:4px 9px;border-radius:7px;cursor:pointer;white-space:nowrap;margin-bottom:2px;}
.mini-link:hover{color:var(--ink);border-color:var(--charcoal);}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:11px 15px;
  font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .12s,background .12s;}
.tab:hover{color:var(--ink);background:rgba(43,49,58,.04);border-radius:8px 8px 0 0;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.tab .badge{background:var(--hair);color:var(--muted);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;font-family:var(--mono);}
.tab.on .badge{background:var(--hair);color:var(--muted);}
.panel{background:var(--surface);border:1px solid var(--hair);border-top:none;border-radius:0 0 12px 12px;box-shadow:0 10px 30px rgba(40,44,50,.07);}
.panel__head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;margin-top:14px;
  background:var(--surface);border:1px solid var(--hair);border-radius:12px 12px 0 0;border-bottom:1px solid var(--hair);flex-wrap:wrap;}
.panel__title{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.panel__title span{color:var(--faint);font-weight:500;font-size:13px;margin-left:10px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;min-width:920px;}
thead th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;
  padding:12px 16px;border-bottom:1px solid var(--hair);white-space:nowrap;background:var(--surface);position:sticky;top:var(--topH,0);z-index:1;}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--ink);}
thead th .arr{color:var(--accent);font-size:9px;margin-left:3px;}
tbody td{padding:8px 16px;line-height:1.3;border-bottom:1px solid var(--hair2);vertical-align:middle;}
tbody tr{transition:background .1s;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--hair2);}
tbody tr.checked{background:#e4e8ec;}
tbody tr.checked td{color:var(--muted);}
tbody tr.checked .desc{text-decoration:line-through;}
.tk{font-family:var(--sans);font-weight:600;color:var(--link);text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums;}
.new-badge{display:inline-block;background:var(--accent);color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;
  padding:1px 5px;border-radius:4px;margin-left:7px;vertical-align:middle;}
tbody tr.isnew{background:rgba(207,75,59,.055);}
tbody tr.isnew:hover{background:rgba(207,75,59,.1);}
.tk:hover{text-decoration:underline;}
.desc{color:var(--ink);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lang{font-family:var(--mono);font-size:12px;color:var(--muted);}
td.langs{max-width:260px;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5;}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.pill.master{background:var(--ok-bg);color:var(--ok);}
.pill.brief{background:var(--brief-bg);color:var(--brief);}
.pill.lqa{background:var(--lqa-bg);color:var(--lqa);cursor:default;}
.pill.lqa::before{content:"●";font-size:8px;margin-right:4px;vertical-align:1px;}
.pill.lqa .x{margin-left:6px;opacity:.55;font-weight:700;cursor:pointer;}
.pill.lqa:hover{filter:brightness(.96);}
.pill.lqa:hover .x{opacity:1;}
.chip-toggle{background:var(--surface);border:1.5px solid var(--lqa);color:var(--lqa);padding:8px 12px;border-radius:8px;
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.chip-toggle:hover{border-color:var(--lqa);color:var(--ink);}
.chip-toggle.on{background:rgba(229,148,47,.14);border-color:var(--lqa);color:var(--lqa);}
.chip-toggle .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  background:var(--lqa);color:#fff;font-family:var(--mono);font-size:10.5px;font-weight:700;margin-left:8px;}
.chip-toggle.on .n{background:var(--lqa);}
.mbadge{font-size:11px;font-weight:600;font-family:var(--mono);white-space:nowrap;}
.mbadge.ok{color:var(--ok);} .mbadge.miss{color:var(--crit);} .mbadge.none{color:var(--faint);}
.thsub{font-weight:600;opacity:.65;text-transform:none;letter-spacing:0;}
.cardcell{display:flex;align-items:center;}
.msgslot{margin-left:auto;width:58px;flex:none;display:flex;justify-content:flex-end;align-items:center;}
.cardcell .msgchip{margin-left:0;}
.msgchip{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:2px 9px;border-radius:999px;background:#fbe1bd;border:1.5px solid var(--lqa);vertical-align:middle;}
.msgchip .msg-open{cursor:pointer;font-size:15px;line-height:1;}
.msgchip .msg-x{cursor:pointer;font-size:11px;font-weight:800;color:#b96f16;opacity:.85;line-height:1;}
.msgchip .msg-x:hover{opacity:1;}
@media (prefers-reduced-motion:no-preference){
  .msgchip{animation:msgpulse 2s ease-in-out infinite;}
  @keyframes msgpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,148,47,0);}50%{box-shadow:0 0 0 5px rgba(229,148,47,.33);}}
}
.modal{position:fixed;inset:0;background:rgba(20,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-card{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--hair);}
.modal-head b{font-size:15px;}
.modal-x{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 4px;}
.modal-x:hover{color:var(--ink);}
.modal-body{padding:6px 18px 16px;overflow:auto;}
.modal-card--wide{max-width:520px;}
.ling-hint{font-size:12px;color:var(--muted);margin:6px 0 12px;}
#lingpop .modal-head{border-bottom:none;}
.ling-table{border-collapse:collapse;table-layout:fixed;width:472px;min-width:0;font-size:12px;margin:0 auto;}
.ling-table th,.ling-table td{border:1px solid var(--hair);padding:3px 5px;text-align:left;overflow:hidden;}
.ling-table th:first-child{width:64px;}
.ling-table th:not(:first-child){width:136px;}
.ling-table thead th{background:var(--hair2);font-weight:700;color:var(--ink);text-transform:capitalize;position:sticky;top:0;font-size:11px;}
.ling-code{background:var(--hair2);font-weight:700;white-space:nowrap;}
.ling-inp{width:100%;box-sizing:border-box;border:1px solid transparent;background:transparent;font:inherit;font-size:12px;color:var(--ink);padding:2px 4px;border-radius:4px;}
.ling-inp:hover{border-color:var(--hair);}
.ling-inp:focus{outline:none;border-color:var(--link);background:var(--surface);}
.ling-foot{display:flex;justify-content:flex-end;padding-top:12px;position:sticky;bottom:0;background:var(--surface);}
.ling-save{background:var(--link);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer;}
.ling-save:hover{filter:brightness(1.05);}
.msgitem{padding:12px 0;border-bottom:1px solid var(--hair2);}
.msgitem:last-child{border-bottom:none;}
.msgmeta{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.msgtext{font-size:13px;color:var(--ink);white-space:pre-wrap;line-height:1.55;}
.sheet-list{display:flex;flex-direction:column;gap:7px;margin:8px 0 18px;}
.sheet-row{display:flex;align-items:center;gap:6px;}
.sheet-pick{flex:1;text-align:left;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:11px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.sheet-pick:hover{filter:brightness(.95);}
.sheet-del{background:none;border:none;cursor:pointer;color:var(--faint);font-size:12px;padding:6px 6px;line-height:1;}
.sheet-del:hover{color:var(--crit);}
.sheet-empty{color:var(--muted);font-size:13px;padding:6px 0 16px;}
.sheet-add{border-top:1px solid var(--hair);padding-top:14px;display:flex;flex-direction:column;gap:8px;}
.sheet-add-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.sheet-add input{padding:9px 11px;border:1px solid var(--hair);border-radius:8px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink);}
.sheet-add input:focus{outline:none;border-color:var(--link);}
.sheet-add button{align-self:flex-start;background:var(--header);color:var(--header-ink);border:none;border-radius:8px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.sheet-add button:hover{filter:brightness(1.12);}
.sheet-foot{margin-top:12px;}
.linklike{background:none;border:none;color:var(--link);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
.linklike:hover{color:var(--accent);}
.typewrap{display:flex;align-items:center;}
.descwrap{display:flex;align-items:center;gap:8px;min-width:0;}
.descwrap .loc-btn{margin:0;flex-shrink:0;width:26px;padding:1px 0;text-align:center;box-sizing:border-box;}
.descwrap .loc-spacer{display:inline-block;width:26px;flex-shrink:0;}
.descwrap .desctext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.typecell .a-role{font-size:12.5px;font-weight:650;}
.typecell .a-role.parent{color:var(--ok);}
.typecell .a-role.child{color:var(--brief);}
.typecell .a-stack{display:flex;flex-direction:column;gap:3px;}
.typecell .a-line{display:flex;gap:7px;align-items:baseline;}
.typecell .ref{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.typecell .a-miss{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--crit);}
.dl{white-space:nowrap;font-variant-numeric:tabular-nums;}
.dl .rel{font-size:11px;font-weight:700;margin-left:7px;}
.dl.overdue .rel{color:var(--crit);} .dl.soon .rel{color:var(--warn);} .dl.ok .rel{color:var(--ok);}
.chk{width:18px;height:18px;cursor:pointer;accent-color:var(--ok);}
.exportcell{white-space:nowrap;}
.automate-btn{background:var(--surface);border:1.5px solid var(--faint);color:var(--muted);border-radius:7px;padding:5px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.automate-btn:hover{border-color:var(--charcoal);color:var(--ink);}
.auto-actions{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px;}
.modal-card--auto{max-width:920px;}
.modal-card--auto .modal-body{padding:12px 26px 24px;}
.auto-cols{display:flex;gap:0;align-items:stretch;padding:10px 0 6px;}
.auto-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:0 22px;}
.auto-col:first-child{padding-left:0;}
.auto-col:last-child{padding-right:0;}
.auto-col+.auto-col{border-left:1px solid var(--hair);}
.auto-group{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ink);margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--hair);}
.auto-step{display:flex;align-items:center;gap:8px;width:100%;min-height:64px;margin:0;padding:16px 18px;font:inherit;font-size:14px;font-weight:700;line-height:1.3;text-align:left;border:none;border-radius:14px;background:var(--hair2);color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(40,44,50,.06);transition:transform .12s ease,box-shadow .18s ease,filter .18s ease;}
.auto-step:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(40,44,50,.17);filter:saturate(1.06);}
.auto-step:active:not(:disabled){transform:translateY(0);box-shadow:none;}
.auto-step:disabled{opacity:.45;cursor:not-allowed;}
/* each section its own colour: header + soft (top) & solid (bottom) buttons in that hue */
.grp-sheet .auto-group{color:#15803d;border-bottom-color:#15803d;}
.grp-crowdin .auto-group{color:#6d28d9;border-bottom-color:#6d28d9;}
.grp-lqa .auto-group{color:#a84018;border-bottom-color:#a84018;}
.auto-step[data-act="sheet"]{background:#e9f7ef;color:#2b7a49;}
.auto-step[data-act="import"]{background:#bfe8d0;color:#1c5e37;}
.auto-step[data-act="import"]:not(:disabled){animation:autopulse 2.2s ease-in-out infinite;}
.auto-step[data-act="import"]:hover:not(:disabled){animation:none;}
@keyframes autopulse{0%,100%{box-shadow:0 1px 2px rgba(40,44,50,.06);}50%{box-shadow:0 0 0 5px rgba(38,140,80,.28);}}
.auto-step[data-act="file"]{background:#f2edfd;color:#6a2fd0;}
.auto-step[data-act="tasks"]{background:#dbcdf8;color:#5620ad;}
.auto-step[data-act="lqa-report"]{background:#fbeee2;color:#a24d1c;}
.auto-step[data-act="lqa-alphas"]{background:#f5d9c2;color:#8a3a16;}
.auto-hint{font-size:11.5px;color:var(--muted);margin-top:-2px;}
.auto-link{display:inline-block;font-size:12px;font-weight:600;color:var(--link);text-decoration:none;margin:-2px 0 2px;}
.auto-link:hover{text-decoration:underline;}
.mgr-list{display:flex;gap:14px;padding:16px 4px 10px;}
.mgr-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--hair);border-radius:14px;padding:22px 14px 18px;font:inherit;cursor:pointer;position:relative;transition:transform .1s ease,box-shadow .16s ease,border-color .16s ease;}
.mgr-item:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(40,44,50,.14);border-color:var(--link);}
.mgr-item.is-last{border-color:var(--link);}
.mgr-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;background:var(--brief-bg);color:var(--link);}
.mgr-item:nth-child(1) .mgr-av{background:#e9f0fa;color:#3e6fb0;}
.mgr-item:nth-child(2) .mgr-av{background:#e7f4ec;color:#2f9e59;}
.mgr-name{font-size:15px;font-weight:700;color:var(--ink);text-transform:capitalize;}
.mgr-last{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--link);background:var(--brief-bg);padding:2px 6px;border-radius:5px;}
.att-list{display:flex;flex-direction:column;gap:8px;padding:6px 0;}
.att-item{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit;}
.att-item:hover{border-color:var(--link);background:var(--brief-bg);}
.att-name{font-weight:600;color:var(--ink);font-size:13px;word-break:break-all;}
.att-meta{font-size:11px;color:var(--muted);}
.att-latest{background:var(--lqa);color:#fff;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:6px;}
.tk-subhead{font-size:11.5px;margin:8px 0 4px;word-break:break-all;}
.tk-row.muted{color:var(--muted);}
.del-btn{background:none;border:none;cursor:pointer;font-size:17px;opacity:.7;padding:2px 4px;line-height:1;}
.del-btn:hover{opacity:1;}
.statsel{font:inherit;font-size:12px;font-weight:600;padding:3px 5px;border:1px solid var(--hair);border-radius:6px;background:var(--surface);cursor:pointer;}
.statsel-none{color:var(--faint);font-weight:400;}
.statsel-sent{color:var(--brief);border-color:var(--brief);background:var(--brief-bg);}
.statsel-inprogress{color:var(--lqa);border-color:var(--lqa);background:var(--lqa-bg);}
.statsel-tr_inprogress,.statsel-pr_inprogress{color:var(--lqa);border-color:var(--lqa);background:var(--lqa-bg);}
.statsel-tr_done,.statsel-pr_done{color:var(--brief);border-color:var(--brief);background:var(--brief-bg);}
.statsel-done{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);}
.exp,.exp-spacer{display:inline-block;width:16px;margin-right:6px;text-align:center;vertical-align:middle;}
.exp{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0;}
.exp:hover{color:var(--ink);}
.loc-btn{background:none;border:1px solid var(--hair);border-radius:6px;cursor:pointer;font-size:13px;color:var(--link);padding:1px 6px;margin-left:8px;vertical-align:middle;line-height:1.2;}
.loc-btn:hover{border-color:var(--link);background:var(--brief-bg);}
tr.detail td{background:var(--hair2);padding:10px 16px 13px;}
.detail-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
.detail-n{color:var(--faint);}
.loc-actions{display:flex;justify-content:flex-end;margin:2px 0 10px;}
.loc-copyall{background:var(--brief-bg);border:1px solid var(--link);color:var(--link);border-radius:7px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.loc-copyall:hover{background:var(--surface);}
.modal-card--loc{max-width:440px;}
.loc-list{display:flex;flex-direction:column;gap:7px;}
.loc-list .loc-item{justify-content:flex-start;gap:9px;padding:7px 11px;font-size:13.5px;}
.loc-list .loc-lang{font-size:13.5px;}
.loc-list .loc-tk{font-size:12px;}
.loc-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;text-decoration:none;color:var(--link);background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:3px 9px;}
.loc-item:hover{border-color:var(--link);}
.loc-lang{font-weight:600;}
.loc-tk{font-family:var(--mono);font-size:11px;color:var(--muted);}
.loc-vest{font-size:10px;font-weight:800;letter-spacing:.02em;padding:2px 6px;border-radius:5px;margin-left:2px;white-space:nowrap;}
.loc-vest.yes{background:var(--ok-bg,#e4f4ea);color:var(--ok,#2e7d46);}
.loc-vest.no{background:var(--crit-bg,#fde8e6);color:var(--crit,#c0392b);}
.loc-open{font-size:11px;color:var(--faint);}
.loc-item.self{border-color:var(--accent);background:var(--crit-bg);}
.loc-item.self .loc-lang{color:var(--accent);}
.loc-item.self .loc-open{color:var(--accent);font-weight:600;}
tr.detail .tk-refresh{background:none;border:1px solid var(--hair);border-radius:6px;color:var(--muted);font:inherit;font-size:10px;cursor:pointer;padding:2px 7px;margin-left:8px;text-transform:none;letter-spacing:0;}
tr.detail .tk-refresh:hover{color:var(--ink);border-color:var(--link);}
.tk-list{display:flex;flex-direction:column;gap:5px;max-width:640px;}
.tk-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.tk-lang{font-weight:700;min-width:56px;color:var(--ink);}
.tk-batch{font-size:10px;font-weight:600;color:var(--lqa);background:var(--lqa-bg);border:1px solid var(--lqa);border-radius:5px;padding:1px 5px;white-space:nowrap;}
.tk-skip{font-size:10px;font-weight:600;color:var(--muted);background:var(--hair2);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;white-space:nowrap;}
.tk-prog{display:flex;align-items:center;gap:7px;min-width:130px;}
.tk-bar{display:inline-block;width:80px;height:7px;border-radius:4px;background:var(--hair);overflow:hidden;}
.tk-bar>span{display:block;height:100%;background:var(--ok);}
.tk-pct{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:34px;}
.tk-open{color:var(--link);text-decoration:none;font-size:12px;}
.tk-open:hover{text-decoration:underline;}
.tk-copy{background:var(--surface);border:1px solid var(--hair);border-radius:6px;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;padding:2px 8px;}
.tk-copy:hover{border-color:var(--link);color:var(--link);}
.tk-err .tk-msg{color:var(--crit);font-size:11px;}
.tk-empty{color:var(--muted);font-size:12px;}
.tk-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.tk-done{background:var(--ok);color:#fff;border:none;border-radius:8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:8px 14px;}
.tk-done:hover{filter:brightness(1.08);}
.tk-done:disabled{opacity:.6;cursor:progress;}
.login{position:fixed;inset:0;background:var(--header);display:flex;align-items:center;justify-content:center;z-index:1000;}
.login__box{background:var(--surface);border-radius:14px;padding:28px;width:320px;max-width:90vw;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login__title{font-size:20px;font-weight:700;color:var(--ink);}
.login__sub{font-size:13px;color:var(--muted);margin-top:-8px;}
.login__box input{padding:10px 12px;border:1px solid var(--hair);border-radius:8px;font-size:14px;font-family:var(--sans);color:var(--ink);}
.login__box input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent;}
.login__btn{background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:2px;}
.login__btn:hover{filter:brightness(.95);}
.login__err{color:var(--crit);font-size:12.5px;min-height:1em;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;}
.toast.show{opacity:1;pointer-events:auto;}
.toast a{color:#9ec5ff;text-decoration:underline;margin-left:8px;}
.center{text-align:center;}
.empty{padding:44px;text-align:center;color:var(--faint);}
.foot{color:var(--faint);font-size:12px;margin-top:14px;text-align:right;}
.foot code{font-family:var(--mono);background:var(--hair);padding:1px 6px;border-radius:4px;}
a:focus-visible,button:focus-visible,input:focus-visible,.tab:focus-visible,th.sortable:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

<script src="data.js"></script>
<script>
(function(){
  var CKEY = 'bt.cards', MKEY = 'bt.cardsAt';
  function safeParse(s){ try { return JSON.parse(s); } catch(e){ return null; } }
  // paint instantly from the last cards we saw (survives reload); the live fetch refreshes it
  var cards = window.__DATA__ || safeParse(localStorage.getItem(CKEY)) || [];
  var DAY = 86400000;
  var state = { tab:'all', sort:'due', dir:1, lqaOnly:false };
  var expandedTasks = {};   // cardId -> true when its Crowdin-tasks panel is open
  var crtasksMap = {};      // cardId -> { fileId, folder, translate:[], proof:[], proofDesired, phase } (shared)
  var progressMap = {};     // crowdin taskId -> percent

  // "Done" is stored per card as the timestamp (ms) when it was checked, so a later
  // LQA handoff can auto-clear it. { cardId: doneAtMs }
  var DKEY = 'briefTracker.done';
  var linguists = {};        // CODE -> { translation, proofreading, lqa } execIds (shared, editable)
  var crFilesMap = {};       // cardId -> [{fileId,name,title,url}] Crowdin files (from load index scan)
  var crFileProg = {};       // cardId -> [{...file with langs/overall progress}] (loaded on expand)
  var LSTAGES = ['translation','proofreading','lqa'];
  var LCODES = ['JP','CHT','CHS','AR','FR-FR','ES-ES','ES-MX','PT-PT','PT-BR','DE','IT','KO','NL','PL','TR'];
  var doneMap = {};
  try { doneMap = JSON.parse(localStorage.getItem(DKEY) || '{}') || {}; } catch(e){ doneMap = {}; }
  // migrate the old boolean set (briefTracker.checked) → timestamped map
  var oldRaw = localStorage.getItem('briefTracker.checked');
  if (oldRaw){
    try { (JSON.parse(oldRaw)||[]).forEach(function(id){ if(!(id in doneMap)) doneMap[id]=Date.now(); }); } catch(e){}
    localStorage.removeItem('briefTracker.checked');
    localStorage.setItem(DKEY, JSON.stringify(doneMap));
  }
  function saveDone(){ localStorage.setItem(DKEY, JSON.stringify(doneMap)); }
  // an LQA handoff comment dated after the card was marked done
  function lqaAfterDone(c, ts){
    return c.lqa && (c.lqaComments||[]).some(function(x){ return x.date && Date.parse(x.date) > ts; });
  }
  function isDone(c){ return c.id in doneMap; }
  function doneCount(){ return Object.keys(doneMap).length; }
  // auto-uncheck Done when a newer tagged (Alpha) comment arrives after it was marked done
  function reconcileDone(){
    var changed=false;
    cards.forEach(function(c){ if((c.id in doneMap) && latestTagTs(c) > doneMap[c.id]){ delete doneMap[c.id]; changed=true; } });
    if(changed) saveDone();
  }

  // "Translation (proofread)" and "LQA" — plain per-card checkboxes, shared across users.
  var TKEY = 'briefTracker.trans', QKEY = 'briefTracker.lqadone';
  var transMap = {}, lqaMap = {};
  try { transMap = JSON.parse(localStorage.getItem(TKEY) || '{}') || {}; } catch(e){ transMap = {}; }
  try { lqaMap   = JSON.parse(localStorage.getItem(QKEY) || '{}') || {}; } catch(e){ lqaMap   = {}; }
  function saveTrans(){ localStorage.setItem(TKEY, JSON.stringify(transMap)); }
  function saveLqaDone(){ localStorage.setItem(QKEY, JSON.stringify(lqaMap)); }
  function isTrans(c){ return c.id in transMap; }
  function isLqaDone(c){ return c.id in lqaMap; }
  // Translation / LQA status dropdown options
  var STATUS = [['','—'],['inprogress','In progress'],['done','Done']];
  var TRANS_STATUS = [['','—'],['tr_inprogress','TR IN PROGRESS'],['tr_done','TR DONE'],['pr_inprogress','PR IN PROGRESS'],['pr_done','PR DONE'],['done','DONE']];

  // "New tagged message" mark — shows when a card's newest Alpha-tagged comment is newer than the
  // shared baseline (tracking start) or the last time anyone cleared it. Clearing is shared; a still-
  // newer tagged comment re-shows it. { cardId: clearedAtMs } + one shared baseline timestamp.
  var GKEY = 'briefTracker.tagseen';
  var tagSeen = {};
  try { tagSeen = JSON.parse(localStorage.getItem(GKEY) || '{}') || {}; } catch(e){ tagSeen = {}; }
  var tagBaseline = Number(localStorage.getItem('briefTracker.tagBaseline')) || Date.now();
  function saveTagSeen(){ localStorage.setItem(GKEY, JSON.stringify(tagSeen)); }
  function setBaseline(b){ if(b!=null){ tagBaseline = Number(b); localStorage.setItem('briefTracker.tagBaseline', String(tagBaseline)); } }
  function latestTagTs(c){ var m=0; (c.tagComments||[]).forEach(function(x){ var t=x.date?Date.parse(x.date):0; if(t>m) m=t; }); return m; }
  function newTag(c){ var t=latestTagTs(c); return t>0 && t > Math.max(tagBaseline||0, tagSeen[c.id]||0); }

  // "Deleted" rows — hidden across all users until a NEWER tagged comment arrives on that card,
  // then the row reappears. { cardId: deletedAtMs }
  var XKEY = 'briefTracker.deleted';
  var delMap = {};
  try { delMap = JSON.parse(localStorage.getItem(XKEY) || '{}') || {}; } catch(e){ delMap = {}; }
  function saveDel(){ localStorage.setItem(XKEY, JSON.stringify(delMap)); }
  function isDeleted(c){ return (c.id in delMap) && latestTagTs(c) <= delMap[c.id]; }

  // "LQA dismissed" — user can remove the LQA tag; stored as the timestamp when dismissed,
  // so a later LQA handoff comment brings it back. { cardId: dismissedAtMs }
  var LKEY = 'briefTracker.lqaDismissed';
  var lqaDismiss = {};
  try { lqaDismiss = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch(e){ lqaDismiss = {}; }
  function saveLqa(){ localStorage.setItem(LKEY, JSON.stringify(lqaDismiss)); }
  // an LQA handoff comment dated after the tag was dismissed → bring it back
  function reconcileLqa(){
    var changed=false;
    cards.forEach(function(c){
      if((c.id in lqaDismiss) && lqaAfterDone(c, lqaDismiss[c.id])){ delete lqaDismiss[c.id]; changed=true; }
    });
    if(changed) saveLqa();
  }
  function lqaVisible(c){ return c.lqa && !(c.id in lqaDismiss); }
  function lqaCount(){ return cards.filter(function(c){ return !isDeleted(c) && lqaVisible(c); }).length; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function daysUntil(due){ if(!due) return null; var d=new Date(due.length<=10?due+'T00:00:00':due); return Math.round((d-new Date())/DAY); }
  function fmtDate(s){ if(!s) return '—'; return new Date(s).toLocaleDateString(undefined,{day:'2-digit',month:'short'}); }
  function dueClass(due){ var n=daysUntil(due); if(n===null) return 'none'; if(n<0) return 'overdue'; if(n<=7) return 'soon'; return 'ok'; }
  function ipOf(c){ return c.ticket.split('-')[0]; }

  var ips = Array.from(new Set(cards.map(ipOf))).sort();
  function tabBtn(id,label,count){ return '<button class="tab'+(state.tab===id?' on':'')+'" data-tab="'+esc(id)+'">'+esc(label)+' <span class="badge">'+count+'</span></button>'; }
  function renderTabs(){
    var vis = cards.filter(function(c){ return !isDeleted(c); });
    var html = tabBtn('all','All',vis.length);
    ips.forEach(function(i){ html += tabBtn(i,i,vis.filter(function(c){return ipOf(c)===i;}).length); });
    document.getElementById('tabs').innerHTML = html;
  }

  function passes(c){
    if(isDeleted(c)) return false;
    if(state.tab!=='all' && ipOf(c)!==state.tab) return false;
    if(state.lqaOnly && !lqaVisible(c)) return false;
    return true;
  }
  function sortList(list){
    var k=state.sort, d=state.dir;
    return list.slice().sort(function(a,b){
      var va=a[k], vb=b[k];
      if(typeof va==='boolean'||typeof vb==='boolean'){ va=va?0:1; vb=vb?0:1; } // true sorts first
      else { va=va||''; vb=vb||''; }
      var r=(va<vb?-1:va>vb?1:0)*d;
      if(r===0){ var ta=a.ticket||'', tb=b.ticket||''; r=(ta<tb?-1:ta>tb?1:0); } // tie-break by ticket
      return r;
    });
  }

  // Does this card have any real Crowdin tasks (in either phase)? A file can exist with none.
  function hasCrTasks(c){ var d=crtasksMap[c.id]; if(!d) return false;
    return (d.translate||[]).some(function(t){return t.taskId;}) || (d.proof||[]).some(function(t){return t.taskId;}); }
  // Crowdin source files found for this card (from the on-load index scan).
  function hasCrFiles(c){ return !!(crFilesMap[c.id] && crFilesMap[c.id].length); }
  function rowHtml(c){
    var isParent = c.role==='master card';
    var roleWord = '<span class="a-role '+(isParent?'parent':'child')+'">'+(isParent?'Parent':'Child')+'</span>';
    var typeInner;
    if(c.masterRef==null){ typeInner = roleWord; }
    else {
      var refPart = '<span class="ref">'+esc(c.masterRef)+'</span>';
      typeInner = '<div class="a-stack">'+roleWord+refPart+'</div>';
    }
    var lqc = c.lqaComments&&c.lqaComments[0];
    var lqa = lqaVisible(c)
      ? '<span class="pill lqa" data-lqa-id="'+esc(c.id)+'" title="'+esc((lqc?lqc.author+' · '+fmtDate(lqc.date)+' · ':'')+(lqc?lqc.text:''))+' — click ✕ to dismiss">LQA<span class="x">✕</span></span>'
      : '<span class="mbadge none">—</span>';
    var langs = (c.languages&&c.languages.length) ? c.languages : (c.language?[c.language]:[]);
    var langCell = langs.length ? esc(langs.join(', ')) : '—';
    var isc = isDone(c);
    var cls = ((isc?'checked ':'')+(c.isNew?'isnew':'')).trim();
    function chk(kind, on){ return '<td class="center"><input class="chk" type="checkbox" data-kind="'+kind+'" data-id="'+esc(c.id)+'"'+(on?' checked':'')+'/></td>'; }
    function statusSel(kind, val){
      var list = (kind==='trans') ? TRANS_STATUS : STATUS;
      var v=val||'';
      var opts=list.map(function(o){ return '<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
      return '<td class="center"><select class="statsel statsel-'+(v||'none')+'" data-kind="'+kind+'" data-id="'+esc(c.id)+'">'+opts+'</select></td>';
    }
    var hasRel = c.related && c.related.items && c.related.items.length;
    var hasTasks = hasCrTasks(c) || hasCrFiles(c);
    return '<tr class="'+cls+'">'
      + '<td><div class="cardcell">'
        + (hasTasks?'<button class="exp" data-tasks="'+esc(c.id)+'" title="Show Crowdin tasks">'+(expandedTasks[c.id]?'▾':'▸')+'</button>':'<span class="exp-spacer"></span>')
        + '<a class="tk" href="'+esc(c.permalink)+'" target="_blank" rel="noreferrer">'+esc(c.ticket)+'</a>'
        + (c.isNew?'<span class="new-badge">NEW</span>':'')
        + '<span class="msgslot">'+(newTag(c)?'<span class="msgchip"><span class="msg-open" data-msg-id="'+esc(c.id)+'" title="Read the new tagged message">💬</span><span class="msg-x" data-msg-clear="'+esc(c.id)+'" title="Clear for everyone">✕</span></span>':'')+'</span>'
        + '</div></td>'
      + '<td class="desc" title="'+esc(c.title)+'"><div class="descwrap">'+(hasRel?'<button class="loc-btn" data-loc="'+esc(c.id)+'" title="Localization cards">≡</button>':'<span class="loc-spacer"></span>')+'<span class="desctext">'+esc(c.title)+'</span></div></td>'
      + '<td class="langs" title="'+esc(langs.join(', '))+'">'+langCell+'</td>'
      + '<td class="typecell"><div class="typewrap">'+typeInner+'</div></td>'
      + '<td>'+lqa+'</td>'
      + statusSel('trans', transMap[c.id])
      + statusSel('lqadone', lqaMap[c.id])
      + chk('done', isc)
      + '<td class="center exportcell"><button class="automate-btn" data-automate="'+esc(c.id)+'">⚙ Automate</button></td>'
      + '<td class="center"><button class="del-btn" data-del="'+esc(c.id)+'" title="Delete this row (comes back if a new tagged comment arrives)">🗑</button></td>'
      + '</tr>';
  }
  function openLocModal(id){
    var c=cards.filter(function(x){return x.id===id;})[0]; if(!c) return;
    var r=c.related||{items:[]};
    var mainTk = (r.type==='siblings' && r.parent) ? r.parent : c.ticket;   // the main/master ticket
    function vestBadge(i){ return i.vest
      ? '<span class="loc-vest yes" title="Vendor Estimate">VE: '+esc(String(i.vest))+'</span>'
      : '<span class="loc-vest no" title="Vendor Estimate is empty">VE ✗</span>'; }
    var chips = r.items.map(function(i){
      if(i.self){
        return '<a class="loc-item self" href="'+esc(i.url)+'" target="_blank" rel="noreferrer">'
          + (i.lang?'<span class="loc-lang">'+esc(i.lang)+'</span>':'')+'<span class="loc-open">this card</span>'+vestBadge(i)+'</a>';
      }
      return '<a class="loc-item" href="'+esc(i.url)+'" target="_blank" rel="noreferrer">'
        + '<span class="loc-lang">'+esc(i.lang||'?')+'</span>'
        + (i.ticket?'<span class="loc-tk">'+esc(i.ticket)+'</span>':'<span class="loc-open">open ↗</span>')+vestBadge(i)+'</a>';
    }).join('');
    locUrls = r.items.map(function(i){ return i.url; }).filter(Boolean);
    document.getElementById('locpopTitle').textContent = mainTk+' Tickets ('+r.items.length+')';
    document.getElementById('locpopBody').innerHTML =
      (locUrls.length?'<div class="loc-actions"><button class="loc-copyall">⧉ Copy all ('+locUrls.length+')</button></div>':'')
      + '<div class="loc-list">'+chips+'</div>';

  // ---- Crowdin micro-steps (each its own button in the Automate modal) ----
  // ③ Create/update the Crowdin source file from the sheet's Original content. Idempotent.
  function createCrowdinFile(c, b){
    var d=crtasksMap[c.id];
    var folder = cardSheet[c.ticket] || (d&&(d.folder||'').replace(/^Google Sheets\//,'')) || lastBatch();
    if(!folder){ toast('Send this card to a sheet first (to choose the batch).'); return; }
    if(b) b.disabled=true;
    toast('Creating/updating the Crowdin file for <b>'+esc(c.ticket)+'</b>…', 9000);
    fetchSheetSource(c).then(function(sheetStrings){
      var strings=(sheetStrings&&sheetStrings.length)?sheetStrings:(c.strings||[]);
      fetch('/api/crowdin-file', { method:'POST', cache:'no-store', headers:cheaders(), body:JSON.stringify({ ticket:c.ticket, strings:strings, folder:folder }) })
        .then(cjson).then(function(f){
          var dd = crtasksMap[c.id] || { fileId:null, folder:'', translate:[], proof:[], proofDesired:undefined, phase:'translate', srcCount:0, taskedCount:0, newIter:0 };
          dd.fileId=f.fileId; dd.folder=f.folder; dd.srcCount=strings.length;

  // ④ Create translation tasks for the file. First run = full-file set (+ proofreading prompt + alphas);
  // if the source grew since (via Create file), makes a "New strings" batch scoped to the new rows.
  function createCrowdinTasks(c, b){
    var d=crtasksMap[c.id];
    if(!d||!d.fileId){
      // file exists in Crowdin (e.g. connector-made) but the dashboard has no record — adopt its id, then retry
      if(b) b.disabled=true;
      resolveFileId(c).then(function(fileId){
        if(!fileId){ toast('Upload the source to Crowdin first for <b>'+esc(c.ticket)+'</b>.'); if(b) b.disabled=false; return; }
        var dd=crtasksMap[c.id]||{ fileId:null, folder:'', translate:[], proof:[], proofDesired:undefined, phase:'translate', srcCount:0, taskedCount:0, newIter:0 };
        dd.fileId=fileId; saveCrtasks(c.id,dd); if(b) b.disabled=false; createCrowdinTasks(c, b);
      });
      return;
    }
    var hasTranslate=(d.translate||[]).some(function(t){return t.taskId;});
    var srcCount=(d.srcCount!=null)?d.srcCount:0;
    var tasked=(d.taskedCount!=null)?d.taskedCount:(hasTranslate?srcCount:0);
    if(b) b.disabled=true;
    if(!hasTranslate){
      toast('Creating translation tasks for <b>'+esc(c.ticket)+'</b>…', 9000);
      fetch('/api/crowdin-tasks', { method:'POST', cache:'no-store', headers:cheaders(), body:JSON.stringify({ fileId:d.fileId, title:c.title, codes:c.languages||[], type:0 }) })
        .then(cjson).then(function(tr){
          d.translate=tr.tasks||[]; d.newIter=0; d.taskedCount=srcCount; d.phase='translate';
          (d.translate||[]).forEach(function(t){ if(t.taskId!=null) progressMap[t.taskId]=t.percent; });
          if(d.proofDesired===undefined||d.proofDesired===null) d.proofDesired=confirm('Create corresponding proofreading tasks too?\n\n(They are created when you mark translation done — Crowdin needs translations to exist first.)');
          saveCrtasks(c.id,d); expandedTasks[c.id]=true; render();
          var made=d.translate.filter(function(t){return t.taskId&&!t.skipped;}).length, sk=d.translate.filter(function(t){return t.skipped;}).length, er=d.translate.filter(function(t){return t.error;}).length;
          toast('Created '+made+' translation task(s)'+(sk?', '+sk+' already existed':'')+(er?', '+er+' failed':'')+'.'); if(b) b.disabled=false;
          createAlphasForTasks(c, d.translate);
        }).catch(function(err){ toast('Create tasks failed: '+esc(String(err.message||err))); if(b) b.disabled=false; });
      return;
    }
    var added=srcCount-tasked;
    if(added<=0){ toast('No new strings for <b>'+esc(c.ticket)+'</b> — tasks already created. (Run Create file after adding rows to pick up new ones.)'); if(b) b.disabled=false; return; }
    d.newIter=(d.newIter||0)+1;
    var label=(d.newIter===1)?'New strings':('#'+d.newIter+' New strings');
    var title=label+' in '+c.title;
    toast('Creating tasks for '+added+' new string(s) in <b>'+esc(c.ticket)+'</b>…', 9000);
    fetch('/api/crowdin-tasks', { method:'POST', cache:'no-store', headers:cheaders(), body:JSON.stringify({ fileId:d.fileId, title:title, codes:c.languages||[], type:0, skipAssigned:true }) })
      .then(cjson).then(function(tr){
        (tr.tasks||[]).forEach(function(t){ t.batch=label; if(t.taskId!=null) progressMap[t.taskId]=t.percent; });
        d.translate=(d.translate||[]).concat(tr.tasks||[]); d.taskedCount=srcCount;
        saveCrtasks(c.id,d); expandedTasks[c.id]=true; render();
        var made=(tr.tasks||[]).filter(function(t){return t.taskId&&!t.skipped;}).length, sk=(tr.tasks||[]).filter(function(t){return t.skipped;}).length, er=(tr.tasks||[]).filter(function(t){return t.error;}).length;
        toast('Created '+made+' task(s) — '+esc(label)+' in <b>'+esc(c.ticket)+'</b>'+(sk?', '+sk+' already existed':'')+(er?', '+er+' failed':'')+'.'); if(b) b.disabled=false;
        createAlphasForTasks(c, tr.tasks);
      }).catch(function(err){ d.newIter--; toast('New-strings tasks failed: '+esc(String(err.message||err))); if(b) b.disabled=false; });

  function makeLqaReport(c, b){
    var appsUrl=localStorage.getItem(SHEET_URL_KEY)||'';
    if(!appsUrl){ toast('Set the Apps Script URL first (⚙ Apps Script URL).'); return; }

    if(b) b.disabled=true;

  });
  document.getElementById('sheetUrlBtn').addEventListener('click', function(){
    var cur=localStorage.getItem(SHEET_URL_KEY)||'';
    var u=prompt('Apps Script web-app /exec URL (public "Anyone" deployment):', cur);
    if(u===null) return;
    u=u.trim();
    if(u){ localStorage.setItem(SHEET_URL_KEY, u); toast('Apps Script URL saved.'); }
    else { localStorage.removeItem(SHEET_URL_KEY); toast('Apps Script URL cleared.'); }
  });
  document.getElementById('sheetpopClose').addEventListener('click', closeSheetPicker);
  document.getElementById('sheetpop').addEventListener('click', function(e){ if(e.target===this) closeSheetPicker(); });
  document.querySelector('thead').addEventListener('click', function(e){
    var th=e.target.closest('th.sortable'); if(!th) return;
    var k=th.getAttribute('data-sort');
    if(state.sort===k) state.dir=-state.dir; else { state.sort=k; state.dir=1; }
    render();
  });
  // Done checkbox
  document.getElementById('rows').addEventListener('change', function(e){
    var box=e.target.closest('.chk'); if(!box) return;
    var id=box.getAttribute('data-id'), ts=Date.now();
    if(box.checked) doneMap[id]=ts; else delete doneMap[id];
    saveDone();
    box.closest('tr').classList.toggle('checked', box.checked); // only Done greys the row
    updateTitle(cards.filter(passes).length);
    syncWrite(box.checked ? { kind:'done', id:id, ts:ts } : { kind:'done', id:id, remove:true });
  });
  // Translation / LQA status dropdowns (shared)
  document.getElementById('rows').addEventListener('change', function(e){
    var sel=e.target.closest('.statsel'); if(!sel) return;
    var id=sel.getAttribute('data-id'), kind=sel.getAttribute('data-kind'), val=sel.value;
    var map = kind==='lqadone' ? lqaMap : transMap;
    var save = kind==='lqadone' ? saveLqaDone : saveTrans;
    if(val) map[id]=val; else delete map[id];
    save();
    sel.className='statsel statsel-'+(val||'none');
    syncWrite(val ? { kind:kind, id:id, val:val } : { kind:kind, id:id, remove:true });
  });

  // ---- data source: live API (/api/wrike-cards) when hosted, else bundled data.js ----
  var upd = document.getElementById('updated');
  function updateUpdated(generatedAt){
    if (generatedAt) {
      var g = new Date(generatedAt);
      upd.textContent = 'Updated ' + g.toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    } else { upd.textContent = 'snapshot'; }
  }
  function applyCards(newCards, generatedAt){
    cards = newCards || [];
    ips = Array.from(new Set(cards.map(ipOf))).sort();
    reconcileDone(); reconcileLqa();
    renderTabs(); render(); setTopOffset();
    updateUpdated(generatedAt);
    try { localStorage.setItem(CKEY, JSON.stringify(cards)); if(generatedAt) localStorage.setItem(MKEY, generatedAt); } catch(e){}
  }
  // ---- shared-password gate (active only when the server has SITE_PASSWORD set) ----
  var KEY = localStorage.getItem('bt.key') || '';
  var signout = document.getElementById('signout');
  function authHeaders(){ return KEY ? { 'x-access-key': KEY } : {}; }
  function showLogin(){ document.getElementById('login').style.display='flex'; signout.style.display='none'; }
  function hideLogin(){ document.getElementById('login').style.display='none'; }
  function signOut(){ KEY=''; localStorage.removeItem('bt.key'); localStorage.removeItem(CKEY); localStorage.removeItem(MKEY); cards=[]; render(); showLogin(); }
  signout.addEventListener('click', signOut);
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var errEl=document.getElementById('loginErr'); errEl.textContent='';
    var pw=document.getElementById('loginPass').value;
    var btn=e.target.querySelector('button'); btn.disabled=true;
    fetch('/api/wrike-cards', { cache:'no-store', headers:{ 'x-access-key': pw } })
      .then(function(r){ if(r.status===401) throw new Error('Wrong password'); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ if(j.error) throw new Error(j.error);
        KEY=pw; localStorage.setItem('bt.key', KEY); signout.style.display=''; hideLogin(); applyCards(j.cards||[], j.generatedAt); fetchState(); checkSheetTabs(); scanCrowdinIndex(); loadManagers(); })
      .catch(function(err){ errEl.textContent = err.message || 'Sign-in failed'; })
      .then(function(){ btn.disabled=false; });
  });

  function loadFromApi(){
    var btn = document.getElementById('refresh');
    btn.disabled = true; btn.classList.add('busy');
    var prev = upd.textContent; upd.textContent = 'Loading from Wrike…';
    return fetch('/api/wrike-cards', { cache:'no-store', headers: authHeaders() })
      .then(function(r){ if (r.status===401){ showLogin(); throw new Error('__AUTH__'); } if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ if (j.error) throw new Error(j.error); signout.style.display = KEY ? '' : 'none'; applyCards(j.cards || [], j.generatedAt); fetchState(); checkSheetTabs(); scanCrowdinIndex(); loadManagers(); })
      .catch(function(e){ if(String(e.message)!=='__AUTH__') upd.textContent = (prev && prev.indexOf('Updated')===0) ? prev : 'snapshot (offline)'; })
      .then(function(){ btn.disabled = false; btn.classList.remove('busy'); });
  }
  document.getElementById('refresh').addEventListener('click', loadFromApi);

  // ---- shared Done / LQA state across all users (Vercel Postgres via /api/state) ----
  var sharedOK = false, migrated = false;
  function applyState(s){
    if(!s) return;
    doneMap = s.done || {}; lqaDismiss = s.lqa || {}; transMap = s.trans || {}; lqaMap = s.lqadone || {};
    tagSeen = s.tagseen || {}; setBaseline(s.tagBaseline); delMap = s.deleted || {};
    crtasksMap = {}; var _ct=s.crtasks||{}; Object.keys(_ct).forEach(function(k){ try{ crtasksMap[k]=JSON.parse(_ct[k]); }catch(e){} });
    var _st=s.sheettab||{}; Object.keys(_st).forEach(function(k){ try{ sheetTabs[k]=JSON.parse(_st[k]); }catch(e){} });  // which cards have a sheet tab (shared, loaded on refresh)
    if(s.linguists && s.linguists.map){ try{ linguists = JSON.parse(s.linguists.map)||{}; }catch(e){} }  // shared preferred-linguist table
    saveDone(); saveLqa(); saveTrans(); saveLqaDone(); saveTagSeen(); saveDel();   // keep the local cache mirrored
    reconcileDone(); reconcileLqa();
    render();
  }
  function postState(body){
    return fetch('/api/state', { method:'POST', cache:'no-store',
        headers: Object.assign({ 'Content-Type':'application/json' }, authHeaders()),
        body: JSON.stringify(body) })
      .then(function(r){ return r.ok ? r.json() : null; });
  }
  // optimistic local change already applied by the caller; this persists it + syncs from the server truth
  function syncWrite(body){ postState(body).then(function(s){ if(s){ sharedOK=true; applyState(s); } }).catch(function(){}); }
  function fetchState(){
    return fetch('/api/state', { cache:'no-store', headers: authHeaders() })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(server){
        if(!server) return; sharedOK = true;
        if(!migrated){
          migrated = true;
          // one-time migration: push any local-only marks up so nothing already ticked here is lost
          Object.keys(doneMap).forEach(function(id){ if(!(id in (server.done||{}))) postState({kind:'done',id:id,ts:doneMap[id]}).catch(function(){}); });
          Object.keys(lqaDismiss).forEach(function(id){ if(!(id in (server.lqa||{}))) postState({kind:'lqa',id:id,ts:lqaDismiss[id]}).catch(function(){}); });
          Object.keys(transMap).forEach(function(id){ if(!(id in (server.trans||{}))) postState({kind:'trans',id:id,ts:transMap[id]}).catch(function(){}); });
          Object.keys(lqaMap).forEach(function(id){ if(!(id in (server.lqadone||{}))) postState({kind:'lqadone',id:id,ts:lqaMap[id]}).catch(function(){}); });
          Object.keys(tagSeen).forEach(function(id){ if(!(id in (server.tagseen||{}))) postState({kind:'tagseen',id:id,ts:tagSeen[id]}).catch(function(){}); });
          Object.keys(delMap).forEach(function(id){ if(!(id in (server.deleted||{}))) postState({kind:'deleted',id:id,ts:delMap[id]}).catch(function(){}); });
          applyState({ done: Object.assign({}, doneMap, server.done||{}), lqa: Object.assign({}, lqaDismiss, server.lqa||{}),
                       trans: Object.assign({}, transMap, server.trans||{}), lqadone: Object.assign({}, lqaMap, server.lqadone||{}),
                       tagseen: Object.assign({}, tagSeen, server.tagseen||{}), tagBaseline: server.tagBaseline,
                       deleted: Object.assign({}, delMap, server.deleted||{}) });
        } else {
          applyState(server);
        }
      })
      .catch(function(){});
  }
  // pick up other users' changes without a manual refresh
  setInterval(function(){ if(sharedOK) fetchState(); }, 25000);
  window.addEventListener('focus', function(){ if(sharedOK) fetchState(); });

  function boot(){ loadFromApi(); } // 401 shows the password prompt; local/offline just shows data

  // keep the sticky column headers docked right below the pinned top block
  function setTopOffset(){
    var el=document.querySelector('.topsticky');
    if(el) document.documentElement.style.setProperty('--topH', el.offsetHeight+'px');
  }
  window.addEventListener('resize', setTopOffset);

  // First paint from the bundled snapshot (instant, works offline)…
  reconcileDone();  // uncheck Done if a newer tagged comment arrived after it was marked done
  reconcileLqa();   // bring back dismissed LQA tags if a newer LQA handoff arrived
  renderTabs();
  render();
  setTopOffset();
  updateUpdated((window.__META__ && window.__META__.generatedAt) || localStorage.getItem(MKEY));
  // …then check auth + pull live data if hosted (login gate when required; snapshot if offline).
  boot();
})();
</script>
</body></html>
